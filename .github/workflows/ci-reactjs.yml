name: CI - ReactJS

on:
  push:
    paths:
      - 'src/frontend/reactjs/**'
      - '.github/workflows/ci-reactjs.yml'
  pull_request:
    paths:
      - 'src/frontend/reactjs/**'
      - '.github/workflows/ci-reactjs.yml'

defaults:
  run:
    working-directory: src/frontend/reactjs

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/reactjs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: reactjs-coverage
          path: src/frontend/reactjs/coverage/
