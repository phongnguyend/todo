services:
  migrate:
    build:
      context: .
      dockerfile: src/api/Dockerfile
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: file:/data/todo.db
    volumes:
      - app_data:/data

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    command: ["node", "dist/api/main"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/todo.db
      FILE_STORAGE_PATH: /data/uploads
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-use-at-least-32-bytes-long}
      PASSWORD_RESET_SECRET_KEY: ${PASSWORD_RESET_SECRET_KEY:-change-me-too}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - app_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/swagger"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    command: ["node", "dist/worker/main"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/todo.db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_SENDER: ${EMAIL_SENDER:-noreply@example.com}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT:-admin@example.com}
      WORKER_INTERVAL_MINUTES: ${WORKER_INTERVAL_MINUTES:-60}
    volumes:
      - app_data:/data
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  app_data:
