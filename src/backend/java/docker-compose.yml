services:
  api:
    build:
      context: .
      dockerfile: todo-api/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/todo;AUTO_SERVER=TRUE"
      FILE_STORAGE_PATH: /data/uploads
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-use-at-least-32-bytes-long}
      PASSWORD_RESET_SECRET_KEY: ${PASSWORD_RESET_SECRET_KEY:-change-me-too}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: todo-worker/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/todo;AUTO_SERVER=TRUE"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      EMAIL_SENDER: ${EMAIL_SENDER:-noreply@example.com}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT:-admin@example.com}
      WORKER_INTERVAL_MINUTES: ${WORKER_INTERVAL_MINUTES:-60}
    volumes:
      - app_data:/data
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  app_data:
